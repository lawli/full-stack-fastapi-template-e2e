    status: blocked
    expectation: pending
    reason: >-
      Needs two inputs from the owner. (1) Intended behavior: the request model accepts any string as email
      (private.py:17) while the declared response model requires an email address (models.py:15, 63), so
      the contract does not say whether a non-email string is accepted or rejected; see
      defects/private-users-create-email-not-validated.md. (2) Permission to execute: if the service
      stores the row, GET /api/v1/users/ validates every row as UserPublic (users.py:50) and may fail for
      all callers until the row is removed.
