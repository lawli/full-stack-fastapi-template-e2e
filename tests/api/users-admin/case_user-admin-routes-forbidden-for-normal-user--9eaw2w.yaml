schema: v1
name: The superuser-only user routes are forbidden for a normal user
description: >-
  Pending expectations: the routes declare the superuser dependency (users.py:34, 55, 184, 214), but
  status 403 and its detail come only from the dependency branch (deps.py:52-56). The normal user is
  signed up by this case and every request targets that same user (the create request reuses its
  email), so a missing check could only touch case-owned data; the user is read back unchanged at
  the end.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|GET|/api/v1/users/|auth|normal-user-forbidden
  - key: api|POST|/api/v1/users/|auth|normal-user-forbidden
  - key: api|PATCH|/api/v1/users/{user_id}|auth|normal-user-forbidden
  - key: api|DELETE|/api/v1/users/{user_id}|auth|normal-user-forbidden
expectation: pending
tags: [users, auth]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case signed up. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: log in as the case-owned user
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_token: $.access_token
      assert:
        status: 200
steps:
  - name: list users as a normal user
    request:
      method: GET
      path: /api/v1/users/
      headers:
        Authorization: Bearer ${ctx.user_token}
    assert:
      status: 403
      json:
        detail: The user doesn't have enough privileges
  - name: create a user as a normal user
    request:
      method: POST
      path: /api/v1/users/
      headers:
        Authorization: Bearer ${ctx.user_token}
      body:
        email: r2t-${ctx.case.id_short}@example.com
        password: Pw-${ctx.case.id_short}
    assert:
      status: 403
      json:
        detail: The user doesn't have enough privileges
  - name: update a user by id as a normal user
    request:
      method: PATCH
      path: /api/v1/users/${ctx.user_id}
      headers:
        Authorization: Bearer ${ctx.user_token}
      body:
        full_name: r2t changed ${ctx.case.id_short}
    assert:
      status: 403
      json:
        detail: The user doesn't have enough privileges
  - name: delete a user by id as a normal user
    request:
      method: DELETE
      path: /api/v1/users/${ctx.user_id}
      headers:
        Authorization: Bearer ${ctx.user_token}
    assert:
      status: 403
      json:
        detail: The user doesn't have enough privileges
  - name: read the user as superuser to confirm it is unchanged
    request:
      method: GET
      path: /api/v1/users/${ctx.user_id}
      headers:
        Authorization: Bearer ${ctx.admin_token}
    assert:
      status: 200
      json:
        full_name: r2t ${ctx.case.id_short}
teardown:
  steps:
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
