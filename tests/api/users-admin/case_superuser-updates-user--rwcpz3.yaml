schema: v1
name: A superuser updates a user's name, password and active flag
description: >-
  PATCH /users/{user_id} takes UserUpdate and returns UserPublic (users.py:182-192; models.py:33-38;
  types.gen.ts:722). The new password is then used to log in; the deactivation is the last step
  because a deactivated user can no longer log in. The user belongs to this case.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|PATCH|/api/v1/users/{user_id}|happy|superuser-updates-full-name
  - key: api|PATCH|/api/v1/users/{user_id}|happy|superuser-sets-new-password
  - key: api|PATCH|/api/v1/users/{user_id}|happy|superuser-deactivates-user
tags: [users, happy]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case signed up. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
steps:
  - name: update the full name
    request:
      method: PATCH
      path: /api/v1/users/${ctx.user_id}
      headers:
        Authorization: Bearer ${ctx.admin_token}
      body:
        full_name: r2t renamed ${ctx.case.id_short}
    assert:
      status: 200
      json:
        id: ${ctx.user_id}
        full_name: r2t renamed ${ctx.case.id_short}
        email: r2t-${ctx.case.id_short}@example.com
  - name: set a new password
    request:
      method: PATCH
      path: /api/v1/users/${ctx.user_id}
      headers:
        Authorization: Bearer ${ctx.admin_token}
      body:
        password: Nw-${ctx.case.id_short}
    assert:
      status: 200
      json:
        id: ${ctx.user_id}
        password: "@absent"
        hashed_password: "@absent"
  - name: log in with the new password
    request:
      method: POST
      path: /api/v1/login/access-token
      form:
        username: r2t-${ctx.case.id_short}@example.com
        password: Nw-${ctx.case.id_short}
    assert:
      status: 200
      json:
        access_token: "@type string"
  - name: deactivate the user
    request:
      method: PATCH
      path: /api/v1/users/${ctx.user_id}
      headers:
        Authorization: Bearer ${ctx.admin_token}
      body:
        is_active: false
    assert:
      status: 200
      json:
        id: ${ctx.user_id}
        is_active: false
teardown:
  steps:
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
