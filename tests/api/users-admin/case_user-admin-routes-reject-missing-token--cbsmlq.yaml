schema: v1
name: The user administration routes reject a request without a token
description: >-
  Pending expectations: the repository declares the bearer scheme (deps.py:16-18; sdk.gen.ts
  "security" on each operation) but not the response for a missing token; 401 "Not authenticated"
  is the default of the pinned framework's OAuth2PasswordBearer. Every request targets the user this
  case signed up (the create request reuses its email), so a missing check could only touch
  case-owned data; the user is read back unchanged at the end.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|GET|/api/v1/users/|auth|missing-token-rejected
  - key: api|POST|/api/v1/users/|auth|missing-token-rejected
  - key: api|GET|/api/v1/users/{user_id}|auth|missing-token-rejected
  - key: api|PATCH|/api/v1/users/{user_id}|auth|missing-token-rejected
  - key: api|DELETE|/api/v1/users/{user_id}|auth|missing-token-rejected
expectation: pending
tags: [users, auth]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case signed up. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
steps:
  - name: list users without a token
    request:
      method: GET
      path: /api/v1/users/
    assert:
      status: 401
      json:
        detail: Not authenticated
  - name: create a user without a token
    request:
      method: POST
      path: /api/v1/users/
      body:
        email: r2t-${ctx.case.id_short}@example.com
        password: Pw-${ctx.case.id_short}
    assert:
      status: 401
      json:
        detail: Not authenticated
  - name: read the user without a token
    request:
      method: GET
      path: /api/v1/users/${ctx.user_id}
    assert:
      status: 401
      json:
        detail: Not authenticated
  - name: update the user without a token
    request:
      method: PATCH
      path: /api/v1/users/${ctx.user_id}
      body:
        full_name: r2t changed ${ctx.case.id_short}
    assert:
      status: 401
      json:
        detail: Not authenticated
  - name: delete the user without a token
    request:
      method: DELETE
      path: /api/v1/users/${ctx.user_id}
    assert:
      status: 401
      json:
        detail: Not authenticated
  - name: read the user as superuser to confirm it is unchanged
    request:
      method: GET
      path: /api/v1/users/${ctx.user_id}
      headers:
        Authorization: Bearer ${ctx.admin_token}
    assert:
      status: 200
      json:
        full_name: r2t ${ctx.case.id_short}
teardown:
  steps:
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
