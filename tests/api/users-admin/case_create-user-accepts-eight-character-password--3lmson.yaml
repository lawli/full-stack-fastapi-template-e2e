schema: v1
name: User creation accepts a password of exactly eight characters
description: >-
  UserCreate.password declares min_length 8 (models.py:23), so an eight-character password is the
  shortest accepted value. The new user then logs in with it. In the reference deployment the route
  also sends a new-account mail to the new address.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/users/|boundary|password-min-length-accepted
tags: [users, boundary]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case created. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<created_id>; the user's email is r2t-<case id_short>@example.com. One
    new-account mail addressed to that address stays in the mail catcher; it is not removed by this
    case.
  resources:
    - user r2t-<case id_short>@example.com
    - new-account mail to r2t-<case id_short>@example.com in the mail catcher
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
steps:
  - name: create a user with an eight-character password
    request:
      method: POST
      path: /api/v1/users/
      headers:
        Authorization: Bearer ${ctx.admin_token}
      body:
        email: r2t-${ctx.case.id_short}@example.com
        password: Pw-12345
    extract:
      created_id: $.id
    assert:
      status: 200
      json:
        id: "@uuid"
        email: r2t-${ctx.case.id_short}@example.com
  - name: log in as the created user
    request:
      method: POST
      path: /api/v1/login/access-token
      form:
        username: r2t-${ctx.case.id_short}@example.com
        password: Pw-12345
    assert:
      status: 200
      json:
        access_token: "@type string"
teardown:
  steps:
    - name: delete the created user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.created_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
