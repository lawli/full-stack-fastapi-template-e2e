schema: v1
name: The user list answers a negative skip or limit with the declared response
description: >-
  skip and limit are declared as unconstrained integers (users.py:37; types.gen.ts:478-482), so
  negative values are inside the declared schema and the declared answer is 200 UsersPublic
  (users.py:35; types.gen.ts:500). The handler passes both values straight into the SQL OFFSET and
  LIMIT (users.py:45-47); see defects/users-list-negative-skip-limit.md for the suspected conflict.
  Read-only.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|GET|/api/v1/users/|boundary|negative-skip-or-limit-within-declared-schema
mutates: false
tags: [users, boundary]
known_defects:
  - ref: defects/users-list-negative-skip-limit.md
    step: list users with limit -1
    at: status
steps:
  - name: log in as the provided superuser
    request:
      method: POST
      path: /api/v1/login/access-token
      form:
        username: ${ctx.profile.test_data.superuser.email}
        password: ${ctx.profile.test_data.superuser.password}
    extract:
      admin_token: $.access_token
    assert:
      status: 200
  - name: list users with limit -1
    request:
      method: GET
      path: /api/v1/users/
      params:
        limit: -1
      headers:
        Authorization: Bearer ${ctx.admin_token}
    assert:
      status: 200
      json:
        data: "@type array"
        count: "@type integer"
  - name: list users with skip -1
    request:
      method: GET
      path: /api/v1/users/
      params:
        skip: -1
      headers:
        Authorization: Bearer ${ctx.admin_token}
    assert:
      status: 200
      json:
        data: "@type array"
        count: "@type integer"
