schema: v1
name: The user-by-id routes validate the id format and the new password length
description: >-
  user_id is declared as a UUID on GET, PATCH and DELETE (users.py:164, 190, 216) and
  UserUpdate.password declares min_length 8 (models.py:38); the API document lists 422
  HTTPValidationError for each route (types.gen.ts:683, 713, 653). The malformed id matches no
  record; the password request targets a user signed up by this case, which then still logs in
  with its original password.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|GET|/api/v1/users/{user_id}|validation|malformed-uuid
  - key: api|PATCH|/api/v1/users/{user_id}|validation|malformed-uuid
  - key: api|DELETE|/api/v1/users/{user_id}|validation|malformed-uuid
  - key: api|PATCH|/api/v1/users/{user_id}|validation|password-too-short
tags: [users, validation]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case signed up. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
steps:
  - name: read a user id that is not a UUID
    request:
      method: GET
      path: /api/v1/users/not-a-uuid
      headers:
        Authorization: Bearer ${ctx.admin_token}
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains user_id"
        detail.0.type: "@type string"
  - name: update a user id that is not a UUID
    request:
      method: PATCH
      path: /api/v1/users/not-a-uuid
      headers:
        Authorization: Bearer ${ctx.admin_token}
      body:
        full_name: r2t ${ctx.case.id_short}
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains user_id"
        detail.0.type: "@type string"
  - name: delete a user id that is not a UUID
    request:
      method: DELETE
      path: /api/v1/users/not-a-uuid
      headers:
        Authorization: Bearer ${ctx.admin_token}
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains user_id"
        detail.0.type: "@type string"
  - name: set a 7-character password on the case-owned user
    request:
      method: PATCH
      path: /api/v1/users/${ctx.user_id}
      headers:
        Authorization: Bearer ${ctx.admin_token}
      body:
        password: seven77
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains password"
        detail.0.type: "@type string"
  - name: log in with the unchanged original password
    request:
      method: POST
      path: /api/v1/login/access-token
      form:
        username: r2t-${ctx.case.id_short}@example.com
        password: Pw-${ctx.case.id_short}
    assert:
      status: 200
teardown:
  steps:
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
