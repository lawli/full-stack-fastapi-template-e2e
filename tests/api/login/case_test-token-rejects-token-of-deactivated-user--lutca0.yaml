schema: v1
name: A token whose user was deactivated is rejected
description: >-
  Pending expectation: 400 "Inactive user" for a valid token whose user was deactivated after login
  comes only from the dependency branch (deps.py:44-45). The user is signed up by this case and
  deactivated by the provided superuser.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/login/test-token|auth|token-of-deactivated-user-rejected
expectation: pending
tags: [login, auth]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case signed up. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: log in as the case-owned user
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_token: $.access_token
      assert:
        status: 200
    - name: deactivate the case-owned user
      request:
        method: PATCH
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
        body:
          is_active: false
      assert:
        status: 200
        json:
          is_active: false
steps:
  - name: test the token of the deactivated user
    request:
      method: POST
      path: /api/v1/login/test-token
      headers:
        Authorization: Bearer ${ctx.user_token}
    assert:
      status: 400
      json:
        detail: Inactive user
teardown:
  steps:
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
