schema: v1
name: Login rejects a wrong password and an unknown email
description: >-
  Pending expectation: status 400 and the detail text come only from the handler branch
  (login.py:33-34, crud.py:47-54). The wrong-password attempt uses the provided superuser email with
  a value that cannot be its password; a failed login writes nothing (crud.py:53-54).
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/login/access-token|auth|wrong-password-rejected
  - key: api|POST|/api/v1/login/access-token|auth|unknown-email-rejected
expectation: pending
mutates: false
tags: [login, auth]
steps:
  - name: log in with a wrong password
    request:
      method: POST
      path: /api/v1/login/access-token
      form:
        username: ${ctx.profile.test_data.superuser.email}
        password: wrong-${ctx.case.id_short}
    assert:
      status: 400
      json:
        detail: Incorrect email or password
  - name: log in with an email that is not registered
    request:
      method: POST
      path: /api/v1/login/access-token
      form:
        username: r2t-none-${ctx.case.id_short}@example.com
        password: Pw-${ctx.case.id_short}
    assert:
      status: 400
      json:
        detail: Incorrect email or password
