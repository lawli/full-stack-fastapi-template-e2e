schema: v1
name: Login without the password form field is a validation error
description: >-
  The login form declares username and password as required (login.py:25 OAuth2PasswordRequestForm;
  types.gen.ts:18-22) and the API document lists 422 HTTPValidationError (types.gen.ts:352-357).
  Nothing is written: validation rejects the request before the handler runs.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/login/access-token|validation|missing-password-field
mutates: false
tags: [login, validation]
steps:
  - name: log in without the password field
    request:
      method: POST
      path: /api/v1/login/access-token
      form:
        username: r2t-${ctx.case.id_short}@example.com
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains password"
        detail.0.msg: "@type string"
        detail.0.type: "@type string"
