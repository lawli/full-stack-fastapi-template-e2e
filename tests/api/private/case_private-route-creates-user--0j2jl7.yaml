schema: v1
name: The development-only private route creates a user without authentication
description: >-
  POST /private/users/ takes PrivateUserCreate and returns UserPublic (private.py:16-24;
  types.gen.ts:944); no authentication is declared for it (sdk.gen.ts:373-382). The route exists
  only when FASTAPI_ENV is "development" (api/main.py:13-14), which holds for the reference
  deployment. The stored user keeps the declared defaults, is_active true and is_superuser false
  (models.py:16-17), and then logs in. The superuser login in setup is only for teardown.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/private/users/|happy|creates-user-without-authentication
tags: [private, happy]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case created. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
steps:
  - name: create a user through the private route without a token
    request:
      method: POST
      path: /api/v1/private/users/
      body:
        email: r2t-${ctx.case.id_short}@example.com
        password: Pw-${ctx.case.id_short}
        full_name: r2t ${ctx.case.id_short}
    extract:
      user_id: $.id
    assert:
      status: 200
      json:
        id: "@uuid"
        email: r2t-${ctx.case.id_short}@example.com
        full_name: r2t ${ctx.case.id_short}
        is_active: true
        is_superuser: false
        password: "@absent"
        hashed_password: "@absent"
  - name: log in as the created user
    request:
      method: POST
      path: /api/v1/login/access-token
      form:
        username: r2t-${ctx.case.id_short}@example.com
        password: Pw-${ctx.case.id_short}
    assert:
      status: 200
      json:
        access_token: "@type string"
teardown:
  steps:
    - name: delete the created user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
