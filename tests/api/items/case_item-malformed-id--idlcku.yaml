schema: v1
name: The item-by-id routes reject an id that is not a UUID
description: >-
  id is declared as a UUID on GET, PUT and DELETE (items.py:49, 80, 101) and the API document lists
  422 HTTPValidationError for each route (types.gen.ts:880, 910, 850). The malformed id matches no
  record; the caller is a user signed up by this case.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|GET|/api/v1/items/{id}|validation|malformed-uuid
  - key: api|PUT|/api/v1/items/{id}|validation|malformed-uuid
  - key: api|DELETE|/api/v1/items/{id}|validation|malformed-uuid
tags: [items, validation]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case signed up; deleting a user also deletes its items. If it
    fails, log in as a superuser and call DELETE /api/v1/users/<user_id>; the user's email is
    r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: log in as the case-owned user
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_token: $.access_token
      assert:
        status: 200
steps:
  - name: read an item id that is not a UUID
    request:
      method: GET
      path: /api/v1/items/not-a-uuid
      headers:
        Authorization: Bearer ${ctx.user_token}
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains id"
        detail.0.type: "@type string"
  - name: update an item id that is not a UUID
    request:
      method: PUT
      path: /api/v1/items/not-a-uuid
      headers:
        Authorization: Bearer ${ctx.user_token}
      body:
        title: r2t item ${ctx.case.id_short}
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains id"
        detail.0.type: "@type string"
  - name: delete an item id that is not a UUID
    request:
      method: DELETE
      path: /api/v1/items/not-a-uuid
      headers:
        Authorization: Bearer ${ctx.user_token}
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains id"
        detail.0.type: "@type string"
teardown:
  steps:
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
