schema: v1
name: The owner deletes its item
description: >-
  DELETE /items/{id} returns the Message model (items.py:99-102; models.py:116-117;
  types.gen.ts:859). The message text is not part of the contract. The item and its owner are
  created by this case.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|DELETE|/api/v1/items/{id}|happy|owner-deletes-item
tags: [items, happy]
data:
  isolated: true
  cleanup: >-
    The owner deletes the item in the execute step; teardown repeats the delete and accepts 404,
    then deletes the user with the provided superuser. If anything remains, log in as a superuser
    and call DELETE /api/v1/items/<item_id> and DELETE /api/v1/users/<user_id>; the user's email is
    r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
    - item "r2t item <case id_short>" owned by that user
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: log in as the case-owned user
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_token: $.access_token
      assert:
        status: 200
    - name: create an item owned by the case-owned user
      request:
        method: POST
        path: /api/v1/items/
        headers:
          Authorization: Bearer ${ctx.user_token}
        body:
          title: r2t item ${ctx.case.id_short}
      extract:
        item_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
steps:
  - name: delete the item as its owner
    request:
      method: DELETE
      path: /api/v1/items/${ctx.item_id}
      headers:
        Authorization: Bearer ${ctx.user_token}
    assert:
      status: 200
      json:
        message: "@type string"
teardown:
  steps:
    - name: delete the item if it still exists
      request:
        method: DELETE
        path: /api/v1/items/${ctx.item_id}
        headers:
          Authorization: Bearer ${ctx.user_token}
      assert:
        status: [200, 404]
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
