schema: v1
name: A normal user's item list holds only its own items
description: >-
  Pending expectation: restricting a normal user's list and count to its own items comes only from
  the handler branch (items.py:28-42). Two users signed up by this case each create one item; user
  A's list must hold exactly its own item.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|GET|/api/v1/items/|auth|normal-user-sees-only-own-items
expectation: pending
tags: [items, auth]
data:
  isolated: true
  cleanup: >-
    Teardown deletes both items with their owners' tokens and then both users with the provided
    superuser. If it fails, log in as a superuser and call DELETE /api/v1/items/<id> for each item
    and DELETE /api/v1/users/<id> for each user; the users' emails are
    r2t-a-<case id_short>@example.com and r2t-b-<case id_short>@example.com.
  resources:
    - user r2t-a-<case id_short>@example.com with item "r2t item a <case id_short>"
    - user r2t-b-<case id_short>@example.com with item "r2t item b <case id_short>"
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up user A
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-a-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_a_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: sign up user B
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-b-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_b_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: log in as user A
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: r2t-a-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_a_token: $.access_token
      assert:
        status: 200
    - name: log in as user B
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: r2t-b-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_b_token: $.access_token
      assert:
        status: 200
    - name: user A creates an item
      request:
        method: POST
        path: /api/v1/items/
        headers:
          Authorization: Bearer ${ctx.user_a_token}
        body:
          title: r2t item a ${ctx.case.id_short}
      extract:
        item_a_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: user B creates an item
      request:
        method: POST
        path: /api/v1/items/
        headers:
          Authorization: Bearer ${ctx.user_b_token}
        body:
          title: r2t item b ${ctx.case.id_short}
      extract:
        item_b_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
steps:
  - name: user A lists items
    request:
      method: GET
      path: /api/v1/items/
      headers:
        Authorization: Bearer ${ctx.user_a_token}
    assert:
      status: 200
      json:
        count: 1
        data: "@len 1"
        data.0.id: ${ctx.item_a_id}
        data.0.owner_id: ${ctx.user_a_id}
teardown:
  steps:
    - name: delete user A's item
      request:
        method: DELETE
        path: /api/v1/items/${ctx.item_a_id}
        headers:
          Authorization: Bearer ${ctx.user_a_token}
      assert:
        status: [200, 404]
    - name: delete user B's item
      request:
        method: DELETE
        path: /api/v1/items/${ctx.item_b_id}
        headers:
          Authorization: Bearer ${ctx.user_b_token}
      assert:
        status: [200, 404]
    - name: delete user A
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_a_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
    - name: delete user B
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_b_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
