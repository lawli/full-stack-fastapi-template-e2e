schema: v1
name: The item list rejects a non-integer skip
description: >-
  skip is declared as an integer query parameter (items.py:15; types.gen.ts:782) and the API
  document lists 422 HTTPValidationError (types.gen.ts:791-796). Read-only: the login is the first
  execute step.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|GET|/api/v1/items/|validation|non-integer-skip
mutates: false
tags: [items, validation]
steps:
  - name: log in as the provided superuser
    request:
      method: POST
      path: /api/v1/login/access-token
      form:
        username: ${ctx.profile.test_data.superuser.email}
        password: ${ctx.profile.test_data.superuser.password}
    extract:
      admin_token: $.access_token
    assert:
      status: 200
  - name: list items with a non-integer skip
    request:
      method: GET
      path: /api/v1/items/
      params:
        skip: abc
      headers:
        Authorization: Bearer ${ctx.admin_token}
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains skip"
        detail.0.type: "@type string"
