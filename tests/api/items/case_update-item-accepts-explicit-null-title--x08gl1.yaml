schema: v1
name: An item update with an explicit null title answers with the declared response
description: >-
  ItemUpdate declares title as a string or null (models.py:86; types.gen.ts:94), so an explicit
  null is inside the declared schema and the declared answer is 200 ItemPublic, whose title is a
  required string (items.py:75; models.py:75, 104; types.gen.ts:68, 919). The handler copies every
  sent field onto the row (items.py:91-94); see defects/items-update-explicit-null-title.md for the
  suspected conflict. The item and its owner are created by this case.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|PUT|/api/v1/items/{id}|boundary|explicit-null-title-within-declared-schema
tags: [items, boundary]
known_defects:
  - ref: defects/items-update-explicit-null-title.md
    step: update the item with an explicit null title
    at: status
data:
  isolated: true
  cleanup: >-
    Teardown deletes the item with its owner's token and then the user with the provided superuser.
    If it fails, log in as a superuser and call DELETE /api/v1/items/<item_id> and
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
    - item "r2t item <case id_short>" owned by that user
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: log in as the case-owned user
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_token: $.access_token
      assert:
        status: 200
    - name: create an item owned by the case-owned user
      request:
        method: POST
        path: /api/v1/items/
        headers:
          Authorization: Bearer ${ctx.user_token}
        body:
          title: r2t item ${ctx.case.id_short}
      extract:
        item_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
steps:
  - name: update the item with an explicit null title
    request:
      method: PUT
      path: /api/v1/items/${ctx.item_id}
      headers:
        Authorization: Bearer ${ctx.user_token}
      body:
        title: null
    assert:
      status: 200
      json:
        id: ${ctx.item_id}
        title: "@type string"
teardown:
  steps:
    - name: delete the item
      request:
        method: DELETE
        path: /api/v1/items/${ctx.item_id}
        headers:
          Authorization: Bearer ${ctx.user_token}
      assert:
        status: [200, 404]
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
