schema: v1
name: Item creation validates the title and the description length
description: >-
  ItemCreate declares title as required with min_length 1 and max_length 255 and description with
  max_length 255 (models.py:75-76); the API document lists 422 HTTPValidationError
  (types.gen.ts:816-821). The caller is a user signed up by this case: an item that a missing check
  let through would belong to that user and is removed together with it in teardown
  (users.py:228-229).
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/items/|validation|title-too-long
  - key: api|POST|/api/v1/items/|validation|empty-title
  - key: api|POST|/api/v1/items/|validation|missing-title
  - key: api|POST|/api/v1/items/|validation|description-too-long
tags: [items, validation]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case signed up; deleting a user also deletes its items. If it
    fails, log in as a superuser and call DELETE /api/v1/users/<user_id>; the user's email is
    r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: log in as the case-owned user
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_token: $.access_token
      assert:
        status: 200
steps:
  - name: create an item with a 256-character title
    request:
      method: POST
      path: /api/v1/items/
      headers:
        Authorization: Bearer ${ctx.user_token}
      body:
        title: "${'t' * 256}"
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains title"
        detail.0.type: "@type string"
  - name: create an item with an empty title
    request:
      method: POST
      path: /api/v1/items/
      headers:
        Authorization: Bearer ${ctx.user_token}
      body:
        title: ""
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains title"
        detail.0.type: "@type string"
  - name: create an item without a title
    request:
      method: POST
      path: /api/v1/items/
      headers:
        Authorization: Bearer ${ctx.user_token}
      body:
        description: r2t description ${ctx.case.id_short}
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains title"
        detail.0.type: "@type string"
  - name: create an item with a 256-character description
    request:
      method: POST
      path: /api/v1/items/
      headers:
        Authorization: Bearer ${ctx.user_token}
      body:
        title: r2t item ${ctx.case.id_short}
        description: "${'d' * 256}"
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains description"
        detail.0.type: "@type string"
teardown:
  steps:
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
