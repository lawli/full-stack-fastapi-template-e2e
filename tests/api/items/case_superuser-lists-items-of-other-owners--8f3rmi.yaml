schema: v1
name: A superuser's item list includes an item owned by another user
description: >-
  Pending expectation: that a superuser's list is not restricted to its own items comes only from
  the handler branch (items.py:21-27). A user signed up by this case creates one item; the
  superuser's list must contain exactly that ItemPublic object (the five fields of
  models.py:74-76, 104-107). The check reads the default first page, which the handler orders
  newest first (items.py:25).
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|GET|/api/v1/items/|auth|superuser-sees-items-of-all-owners
expectation: pending
tags: [items, auth]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the item with its owner's token and then the user with the provided superuser.
    If it fails, log in as a superuser and call DELETE /api/v1/items/<item_id> and
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
    - item "r2t item <case id_short>" owned by that user
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: log in as the case-owned user
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_token: $.access_token
      assert:
        status: 200
    - name: create an item owned by the case-owned user
      request:
        method: POST
        path: /api/v1/items/
        headers:
          Authorization: Bearer ${ctx.user_token}
        body:
          title: r2t item ${ctx.case.id_short}
      extract:
        item_id: $.id
        item_created_at: $.created_at
      assert:
        status: 200
        json:
          id: "@uuid"
          created_at: "@iso8601"
steps:
  - name: list items as superuser
    request:
      method: GET
      path: /api/v1/items/
      headers:
        Authorization: Bearer ${ctx.admin_token}
    assert:
      status: 200
      json:
        data: '@contains {"title": "r2t item ${ctx.case.id_short}", "description": null, "id": "${ctx.item_id}", "owner_id": "${ctx.user_id}", "created_at": "${ctx.item_created_at}"}'
teardown:
  steps:
    - name: delete the item
      request:
        method: DELETE
        path: /api/v1/items/${ctx.item_id}
        headers:
          Authorization: Bearer ${ctx.user_token}
      assert:
        status: [200, 404]
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
