schema: v1
name: Signup does not apply is_superuser or is_active sent in the body
description: >-
  UserRegister declares only email, password and full_name (models.py:26-29; types.gen.ts:248-261),
  so a body that also carries is_superuser and is_active cannot set them: the registered user keeps
  the declared defaults, is_superuser false and is_active true (models.py:16-17). The profile is
  read back as the new user. If the flags were applied, teardown still removes the user by id with
  the provided superuser.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/users/signup|auth|privilege-fields-in-body-not-applied
tags: [signup, auth]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case registered. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
steps:
  - name: sign up with privilege fields in the body
    request:
      method: POST
      path: /api/v1/users/signup
      body:
        email: r2t-${ctx.case.id_short}@example.com
        password: Pw-${ctx.case.id_short}
        full_name: r2t ${ctx.case.id_short}
        is_superuser: true
        is_active: false
    extract:
      user_id: $.id
    assert:
      status: 200
      json:
        id: "@uuid"
        is_superuser: false
        is_active: true
  - name: log in as the registered user
    request:
      method: POST
      path: /api/v1/login/access-token
      form:
        username: r2t-${ctx.case.id_short}@example.com
        password: Pw-${ctx.case.id_short}
    extract:
      user_token: $.access_token
    assert:
      status: 200
  - name: read the own profile
    request:
      method: GET
      path: /api/v1/users/me
      headers:
        Authorization: Bearer ${ctx.user_token}
    assert:
      status: 200
      json:
        id: ${ctx.user_id}
        is_superuser: false
        is_active: true
teardown:
  steps:
    - name: delete the registered user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
