schema: v1
name: Signup validates the email and the password
description: >-
  UserRegister declares email as a required email address and password with min_length 8
  (models.py:27-28); the API document lists 422 HTTPValidationError (types.gen.ts:619-624). No
  request can leave a record behind even if a check were missing: the password case reuses the
  email of a user this case signed up, the email-format case also carries a too-short password (so
  the assertion looks for the email error by its location), and a body without an email has nothing
  to register.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/users/signup|validation|invalid-email-format
  - key: api|POST|/api/v1/users/signup|validation|password-too-short
  - key: api|POST|/api/v1/users/signup|validation|missing-email
tags: [signup, validation]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case signed up. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
steps:
  - name: sign up with a value that is not an email address
    request:
      method: POST
      path: /api/v1/users/signup
      body:
        email: r2t-${ctx.case.id_short}-not-an-email
        password: seven77
    assert:
      status: 422
      json:
        detail: "@type array"
      text: '@regex /"loc":\s*\[\s*"body",\s*"email"\s*\]/'
  - name: sign up with a 7-character password
    request:
      method: POST
      path: /api/v1/users/signup
      body:
        email: r2t-${ctx.case.id_short}@example.com
        password: seven77
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains password"
        detail.0.type: "@type string"
  - name: sign up without an email
    request:
      method: POST
      path: /api/v1/users/signup
      body:
        password: Pw-${ctx.case.id_short}
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains email"
        detail.0.type: "@type string"
teardown:
  steps:
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
