schema: v1
name: Signup registers a new user without a login
description: >-
  "Create new user without the need to be logged in." (users.py:149). POST /users/signup takes
  UserRegister and returns UserPublic (users.py:146-147; models.py:26-29, 63-65; types.gen.ts:632).
  is_active defaults to true and is_superuser to false (models.py:16-17); the response model carries
  neither the password nor its hash. The new user then logs in. The superuser login in setup is
  only for teardown.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/users/signup|happy|registers-new-user-without-login
tags: [signup, happy]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case registered. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
steps:
  - name: sign up without a token
    request:
      method: POST
      path: /api/v1/users/signup
      body:
        email: r2t-${ctx.case.id_short}@example.com
        password: Pw-${ctx.case.id_short}
        full_name: r2t ${ctx.case.id_short}
    extract:
      user_id: $.id
    assert:
      status: 200
      json:
        id: "@uuid"
        email: r2t-${ctx.case.id_short}@example.com
        full_name: r2t ${ctx.case.id_short}
        is_active: true
        is_superuser: false
        created_at: "@iso8601"
        password: "@absent"
        hashed_password: "@absent"
  - name: log in as the registered user
    request:
      method: POST
      path: /api/v1/login/access-token
      form:
        username: r2t-${ctx.case.id_short}@example.com
        password: Pw-${ctx.case.id_short}
    assert:
      status: 200
      json:
        access_token: "@type string"
teardown:
  steps:
    - name: delete the registered user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
