schema: v1
name: A reset token whose user was deleted is rejected like an invalid token
description: >-
  Pending expectation: the source asks for the same error as an invalid token ("Don't reveal that
  the user doesn't exist", login.py:87), but the status 400 and the detail are fixed only by the
  branch (login.py:85-88). The user is signed up by this case; a read-only helper takes its token
  from the recovery mail the local catcher holds for the case-owned address (the superuser-only
  preview route cannot answer, defects/password-recovery-html-content-invalid-header-name.md),
  then the case deletes its own user. The catcher is only read.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/reset-password/|state|token-of-deleted-user-rejected-like-invalid-token
expectation: pending
tags: [password-recovery, state]
requires:
  services: [mailpit]
data:
  isolated: true
  cleanup: >-
    The case deletes its own user in an execute step; teardown repeats the delete and accepts 404.
    If the user still exists, log in as a superuser and call DELETE /api/v1/users/<user_id>; its
    email is r2t-<case id_short>@example.com. One recovery
    mail addressed to that address stays in the mail catcher; it is not removed by this case.
  resources:
    - user r2t-<case id_short>@example.com
    - recovery mail to r2t-<case id_short>@example.com in the mail catcher
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
        user_email: $.email
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: request recovery for the case-owned user
      request:
        method: POST
        path: /api/v1/password-recovery/r2t-${ctx.case.id_short}@example.com
      assert:
        status: 200
  python:
    - call: helpers.recovery.reset_token_from_mail
steps:
  - name: delete the case-owned user as superuser
    request:
      method: DELETE
      path: /api/v1/users/${ctx.user_id}
      headers:
        Authorization: Bearer ${ctx.admin_token}
    assert:
      status: 200
  - name: reset with the token of the deleted user
    request:
      method: POST
      path: /api/v1/reset-password/
      body:
        token: ${ctx.reset_token}
        new_password: Nw-${ctx.case.id_short}
    assert:
      status: 400
      json:
        detail: Invalid token
teardown:
  steps:
    - name: delete the case-owned user if it still exists
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
