schema: v1
name: Reset-password validates the new password length and the token field
description: >-
  NewPassword declares token as required and new_password with min_length 8 and max_length 128
  (models.py:131-133); the API document lists 422 HTTPValidationError (types.gen.ts:423-428).
  Every request also carries a token that is not a reset token, so nothing could be changed even if
  a length check were missing.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/reset-password/|validation|new-password-too-short
  - key: api|POST|/api/v1/reset-password/|validation|new-password-too-long
  - key: api|POST|/api/v1/reset-password/|validation|missing-token-field
mutates: false
tags: [password-recovery, validation]
steps:
  - name: reset with a 7-character new password
    request:
      method: POST
      path: /api/v1/reset-password/
      body:
        token: invalid
        new_password: seven77
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains new_password"
        detail.0.type: "@type string"
  - name: reset with a 129-character new password
    request:
      method: POST
      path: /api/v1/reset-password/
      body:
        token: invalid
        new_password: "${'x' * 129}"
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains new_password"
        detail.0.type: "@type string"
  - name: reset without the token field
    request:
      method: POST
      path: /api/v1/reset-password/
      body:
        new_password: Nw-${ctx.case.id_short}
    assert:
      status: 422
      json:
        detail: "@type array"
        detail.0.loc: "@contains token"
        detail.0.type: "@type string"
