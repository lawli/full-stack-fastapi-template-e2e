schema: v1
name: Password recovery answers alike for a registered and an unregistered email
description: >-
  The route returns the Message model (login.py:54, models.py:116-117; types.gen.ts:411) and the
  source states "Always return the same response to prevent email enumeration attacks"
  (login.py:60). The message text itself is not part of the contract, so the second response is
  compared with the first instead of a literal. The registered address belongs to a user signed up
  by this case; the request sends it one recovery mail.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/password-recovery/{email}|happy|registered-email-returns-message
  - key: api|POST|/api/v1/password-recovery/{email}|error|unregistered-email-returns-same-response
tags: [password-recovery, happy]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case signed up. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com. One recovery
    mail addressed to that address stays in the mail catcher; it is not removed by this case.
  resources:
    - user r2t-<case id_short>@example.com
    - recovery mail to r2t-<case id_short>@example.com in the mail catcher
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
steps:
  - name: request recovery for the registered email
    request:
      method: POST
      path: /api/v1/password-recovery/r2t-${ctx.case.id_short}@example.com
    extract:
      registered_message: $.message
    assert:
      status: 200
      json:
        message: "@type string"
  - name: request recovery for an unregistered email
    request:
      method: POST
      path: /api/v1/password-recovery/r2t-none-${ctx.case.id_short}@example.com
    assert:
      status: 200
      json:
        message: ${ctx.registered_message}
teardown:
  steps:
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
