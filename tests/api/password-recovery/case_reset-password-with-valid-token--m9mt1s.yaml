schema: v1
name: A valid reset token sets a new password
description: >-
  POST /reset-password/ takes NewPassword and returns Message (login.py:78, models.py:131-133;
  types.gen.ts:436). The token only appears inside HTML, so a read-only helper takes it from the
  recovery mail the local catcher holds for the case-owned address, as the repository's own
  end-to-end test does (frontend/tests/reset-password.spec.ts:49-55). The superuser-only preview
  route is not used because it cannot answer
  (defects/password-recovery-html-content-invalid-header-name.md). The new password is then used
  to log in. The user belongs to this case; the catcher is only read.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/reset-password/|happy|valid-token-sets-new-password
tags: [password-recovery, happy]
requires:
  services: [mailpit]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case signed up. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com. One recovery
    mail addressed to that address stays in the mail catcher; it is not removed by this case.
  resources:
    - user r2t-<case id_short>@example.com
    - recovery mail to r2t-<case id_short>@example.com in the mail catcher
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
        user_email: $.email
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: request recovery for the case-owned user
      request:
        method: POST
        path: /api/v1/password-recovery/r2t-${ctx.case.id_short}@example.com
      assert:
        status: 200
  python:
    - call: helpers.recovery.reset_token_from_mail
steps:
  - name: reset the password with the token
    request:
      method: POST
      path: /api/v1/reset-password/
      body:
        token: ${ctx.reset_token}
        new_password: Nw-${ctx.case.id_short}
    assert:
      status: 200
      json:
        message: "@type string"
  - name: log in with the new password
    request:
      method: POST
      path: /api/v1/login/access-token
      form:
        username: r2t-${ctx.case.id_short}@example.com
        password: Nw-${ctx.case.id_short}
    assert:
      status: 200
      json:
        access_token: "@type string"
teardown:
  steps:
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
