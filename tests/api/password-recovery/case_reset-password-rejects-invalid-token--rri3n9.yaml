schema: v1
name: Reset-password rejects a token that is not a valid reset token
description: >-
  Pending expectation: status 400 "Invalid token" comes only from the handler branch
  (login.py:82-84, utils.py:118-125). Nothing is written: the token check fails before any user is
  loaded.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/reset-password/|auth|invalid-token-rejected
expectation: pending
mutates: false
tags: [password-recovery, auth]
steps:
  - name: reset with a token that is not a JWT
    request:
      method: POST
      path: /api/v1/reset-password/
      body:
        token: invalid
        new_password: Nw-${ctx.case.id_short}
    assert:
      status: 400
      json:
        detail: Invalid token
