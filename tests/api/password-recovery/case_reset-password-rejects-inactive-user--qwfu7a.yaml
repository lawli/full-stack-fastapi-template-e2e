schema: v1
name: Reset-password rejects a deactivated user
description: >-
  Pending expectation: status 400 "Inactive user" comes only from the handler branch
  (login.py:89-90). The user is signed up by this case; a read-only helper takes its token from the
  recovery mail the local catcher holds for the case-owned address (the superuser-only preview
  route cannot answer, defects/password-recovery-html-content-invalid-header-name.md), and the
  provided superuser deactivates the user before the reset attempt. The catcher is only read.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|POST|/api/v1/reset-password/|state|inactive-user-rejected
expectation: pending
tags: [password-recovery, state]
requires:
  services: [mailpit]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case signed up. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com. One recovery
    mail addressed to that address stays in the mail catcher; it is not removed by this case.
  resources:
    - user r2t-<case id_short>@example.com
    - recovery mail to r2t-<case id_short>@example.com in the mail catcher
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
        user_email: $.email
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: request recovery for the case-owned user
      request:
        method: POST
        path: /api/v1/password-recovery/r2t-${ctx.case.id_short}@example.com
      assert:
        status: 200
  python:
    - call: helpers.recovery.reset_token_from_mail
steps:
  - name: deactivate the case-owned user
    request:
      method: PATCH
      path: /api/v1/users/${ctx.user_id}
      headers:
        Authorization: Bearer ${ctx.admin_token}
      body:
        is_active: false
    assert:
      status: 200
      json:
        is_active: false
  - name: reset with the token of the deactivated user
    request:
      method: POST
      path: /api/v1/reset-password/
      body:
        token: ${ctx.reset_token}
        new_password: Nw-${ctx.case.id_short}
    assert:
      status: 400
      json:
        detail: Inactive user
teardown:
  steps:
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
