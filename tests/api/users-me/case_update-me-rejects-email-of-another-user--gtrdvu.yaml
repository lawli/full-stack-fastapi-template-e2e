schema: v1
name: A user cannot take another user's email
description: >-
  Pending expectation: the model declares email unique (models.py:15), but status 409 and the detail
  text come only from the handler branch (users.py:89-94). Both users are signed up by this case;
  user A is read back to confirm its email did not change.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|PATCH|/api/v1/users/me|state|email-taken-by-another-user
expectation: pending
tags: [users-me, state]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the two users this case signed up. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<id> for each; their emails are r2t-a-<case id_short>@example.com and
    r2t-b-<case id_short>@example.com.
  resources:
    - user r2t-a-<case id_short>@example.com
    - user r2t-b-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up user A
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-a-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_a_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: sign up user B
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-b-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_b_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: log in as user A
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: r2t-a-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_a_token: $.access_token
      assert:
        status: 200
steps:
  - name: user A sets its email to user B's email
    request:
      method: PATCH
      path: /api/v1/users/me
      headers:
        Authorization: Bearer ${ctx.user_a_token}
      body:
        email: r2t-b-${ctx.case.id_short}@example.com
    assert:
      status: 409
      json:
        detail: User with this email already exists
  - name: user A reads its profile to confirm the email is unchanged
    request:
      method: GET
      path: /api/v1/users/me
      headers:
        Authorization: Bearer ${ctx.user_a_token}
    assert:
      status: 200
      json:
        email: r2t-a-${ctx.case.id_short}@example.com
teardown:
  steps:
    - name: delete user A
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_a_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
    - name: delete user B
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_b_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
