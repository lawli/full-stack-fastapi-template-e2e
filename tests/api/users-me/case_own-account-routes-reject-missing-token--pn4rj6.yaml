schema: v1
name: The own-account routes reject a request without a token
description: >-
  Pending expectations: the repository declares the bearer scheme (deps.py:16-18; sdk.gen.ts
  "security" on each operation) but not the response for a missing token; 401 "Not authenticated"
  is the default of the pinned framework's OAuth2PasswordBearer. Without a token these routes have
  no account to act on. The case still signs up its own user and confirms afterwards that it is
  unchanged and still logs in.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|GET|/api/v1/users/me|auth|missing-token-rejected
  - key: api|PATCH|/api/v1/users/me|auth|missing-token-rejected
  - key: api|PATCH|/api/v1/users/me/password|auth|missing-token-rejected
  - key: api|DELETE|/api/v1/users/me|auth|missing-token-rejected
expectation: pending
tags: [users-me, auth]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case signed up. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
steps:
  - name: read the own profile without a token
    request:
      method: GET
      path: /api/v1/users/me
    assert:
      status: 401
      json:
        detail: Not authenticated
  - name: update the own profile without a token
    request:
      method: PATCH
      path: /api/v1/users/me
      body:
        full_name: r2t changed ${ctx.case.id_short}
    assert:
      status: 401
      json:
        detail: Not authenticated
  - name: change the own password without a token
    request:
      method: PATCH
      path: /api/v1/users/me/password
      body:
        current_password: Pw-${ctx.case.id_short}
        new_password: Nw-${ctx.case.id_short}
    assert:
      status: 401
      json:
        detail: Not authenticated
  - name: delete the own account without a token
    request:
      method: DELETE
      path: /api/v1/users/me
    assert:
      status: 401
      json:
        detail: Not authenticated
  - name: log in as the case-owned user with its original password
    request:
      method: POST
      path: /api/v1/login/access-token
      form:
        username: r2t-${ctx.case.id_short}@example.com
        password: Pw-${ctx.case.id_short}
    assert:
      status: 200
  - name: read the case-owned user as superuser to confirm it is unchanged
    request:
      method: GET
      path: /api/v1/users/${ctx.user_id}
      headers:
        Authorization: Bearer ${ctx.admin_token}
    assert:
      status: 200
      json:
        full_name: r2t ${ctx.case.id_short}
teardown:
  steps:
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
