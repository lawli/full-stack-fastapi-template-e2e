schema: v1
name: A user updates its own full name and email
description: >-
  PATCH /users/me takes UserUpdateMe and returns UserPublic (users.py:81-84; models.py:41-43;
  types.gen.ts:582). Each change is checked in the response and both are read back through
  GET /users/me. The user belongs to this case; its email ends as r2t-new-<case id_short>.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|PATCH|/api/v1/users/me|happy|user-updates-own-full-name
  - key: api|PATCH|/api/v1/users/me|happy|user-updates-own-email
tags: [users-me, happy]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case signed up. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-new-<case id_short>@example.com, or
    r2t-<case id_short>@example.com if the email step did not run.
  resources:
    - user r2t-<case id_short>@example.com (renamed to r2t-new-<case id_short>@example.com)
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: log in as the case-owned user
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_token: $.access_token
      assert:
        status: 200
steps:
  - name: update the own full name
    request:
      method: PATCH
      path: /api/v1/users/me
      headers:
        Authorization: Bearer ${ctx.user_token}
      body:
        full_name: r2t renamed ${ctx.case.id_short}
    assert:
      status: 200
      json:
        id: ${ctx.user_id}
        full_name: r2t renamed ${ctx.case.id_short}
        email: r2t-${ctx.case.id_short}@example.com
  - name: update the own email
    request:
      method: PATCH
      path: /api/v1/users/me
      headers:
        Authorization: Bearer ${ctx.user_token}
      body:
        email: r2t-new-${ctx.case.id_short}@example.com
    assert:
      status: 200
      json:
        id: ${ctx.user_id}
        email: r2t-new-${ctx.case.id_short}@example.com
  - name: read the own profile
    request:
      method: GET
      path: /api/v1/users/me
      headers:
        Authorization: Bearer ${ctx.user_token}
    assert:
      status: 200
      json:
        full_name: r2t renamed ${ctx.case.id_short}
        email: r2t-new-${ctx.case.id_short}@example.com
teardown:
  steps:
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
