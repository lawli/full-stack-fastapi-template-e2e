schema: v1
name: A user deletes its own account
description: >-
  DELETE /users/me declares response_model Message (users.py:132; models.py:116-117;
  types.gen.ts:541). The message text is not part of the contract. The deleted account was signed
  up by this case.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|DELETE|/api/v1/users/me|happy|user-deletes-own-account
tags: [users-me, happy]
data:
  isolated: true
  cleanup: >-
    The case deletes its own user in the execute step; teardown deletes it by id as superuser and
    accepts 404. If the user still exists, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; its email is r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: log in as the case-owned user
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_token: $.access_token
      assert:
        status: 200
steps:
  - name: delete the own account
    request:
      method: DELETE
      path: /api/v1/users/me
      headers:
        Authorization: Bearer ${ctx.user_token}
    assert:
      status: 200
      json:
        message: "@type string"
teardown:
  steps:
    - name: delete the case-owned user if it still exists
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
