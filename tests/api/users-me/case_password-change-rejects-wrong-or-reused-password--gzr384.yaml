schema: v1
name: A password change is rejected for a wrong current password or a reused password
description: >-
  Pending expectations: status 400 and the detail texts come only from handler branches
  (users.py:110-116). After both rejections the user still logs in with its original password. The
  user belongs to this case.
service: api
source_commit: 1762adac607a1b29cfc4da129557780beea71616
covers:
  - key: api|PATCH|/api/v1/users/me/password|error|wrong-current-password
  - key: api|PATCH|/api/v1/users/me/password|state|new-password-same-as-current
expectation: pending
tags: [users-me, error]
data:
  isolated: true
  cleanup: >-
    Teardown deletes the user this case signed up. If it fails, log in as a superuser and call
    DELETE /api/v1/users/<user_id>; the user's email is r2t-<case id_short>@example.com.
  resources:
    - user r2t-<case id_short>@example.com
setup:
  steps:
    - name: log in as the provided superuser
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: ${ctx.profile.test_data.superuser.email}
          password: ${ctx.profile.test_data.superuser.password}
      extract:
        admin_token: $.access_token
      assert:
        status: 200
    - name: sign up the case-owned user
      request:
        method: POST
        path: /api/v1/users/signup
        body:
          email: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
          full_name: r2t ${ctx.case.id_short}
      extract:
        user_id: $.id
      assert:
        status: 200
        json:
          id: "@uuid"
    - name: log in as the case-owned user
      request:
        method: POST
        path: /api/v1/login/access-token
        form:
          username: r2t-${ctx.case.id_short}@example.com
          password: Pw-${ctx.case.id_short}
      extract:
        user_token: $.access_token
      assert:
        status: 200
steps:
  - name: change the password with a wrong current password
    request:
      method: PATCH
      path: /api/v1/users/me/password
      headers:
        Authorization: Bearer ${ctx.user_token}
      body:
        current_password: wrong-${ctx.case.id_short}
        new_password: Nw-${ctx.case.id_short}
    assert:
      status: 400
      json:
        detail: Incorrect password
  - name: change the password to the current password
    request:
      method: PATCH
      path: /api/v1/users/me/password
      headers:
        Authorization: Bearer ${ctx.user_token}
      body:
        current_password: Pw-${ctx.case.id_short}
        new_password: Pw-${ctx.case.id_short}
    assert:
      status: 400
      json:
        detail: New password cannot be the same as the current one
  - name: log in with the unchanged original password
    request:
      method: POST
      path: /api/v1/login/access-token
      form:
        username: r2t-${ctx.case.id_short}@example.com
        password: Pw-${ctx.case.id_short}
    assert:
      status: 200
teardown:
  steps:
    - name: delete the case-owned user
      request:
        method: DELETE
        path: /api/v1/users/${ctx.user_id}
        headers:
          Authorization: Bearer ${ctx.admin_token}
      assert:
        status: [200, 404]
